name: Host tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  release-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure release host build
        run: cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release
      - name: Build release host tools and tests
        run: cmake --build build-release -j4
      - name: Run release host tests
        run: ctest --test-dir build-release --output-on-failure

  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-gfx-dev
      - name: Configure sanitizers
        run: >-
          cmake -S . -B build-test -DVITACYBIKO_FRONTEND_TESTS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build-test -j4
      - run: ctest --test-dir build-test --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
